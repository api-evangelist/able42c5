description: >-
  Negative probe record for Able (able.ai). Able was acquired by Moody's in March 2024 and
  fully absorbed. Its domains are still held by Moody's registrant entity (MIS Quality
  Management Corp., CSC Corporate Domains), but the web surface is decommissioned:
  https://www.able.ai/ terminates every TLS handshake with alert 40 (handshake_failure)
  and presents NO peer certificate, so no HTTPS request to the canonical host can complete.
  The apex able.ai and the ableai.com pair only 301/308 into that dead host. The plain-HTTP
  listener on www.able.ai 301-redirects to Moody's Commercial Lending Solutions page, which
  is the provider's own confirmation of the absorption. NOT ONE document was retrieved on
  any host. No WellKnown, SecurityTxt, AgentCard, LLMsTxt, APIsJSON or OpenAPI pointer is
  emitted from this probe, and none should ever be emitted from it in a later round.

