  Moody's") and Moody's 2024 reporting record the transaction; Moody's redirects
  http://www.able.ai/ to https://www.moodys.com/web/en/us/solutions/lending.html, which is the
  acquirer's own confirmation of where the product went.
x-domain-status: retained-by-acquirer-decommissioned
x-domain-note: >-
  able.ai (created 2018-02-16, updated 2026-08-12) and ableai.com (created 2016-01-26, expires
  2027-01-26) are both registered through CSC Corporate Domains with Google Cloud nameservers;
  able.ai's registrant organization is MIS Quality Management Corp., Moody's Investors Service's
  corporate registrant. The apex able.ai still answers from a Webflow origin but 301s every path
  to https://www.able.ai/, whose Cloudflare edge presents NO certificate and aborts TLS with
  alert 40 (handshake_failure). ableai.com and www.ableai.com 308 to https://able.ai:443/. No
  path on any of the four hosts returns a document, so no Website pointer is wired and no
  well-known/spec pointer is emitted. See well-known/able42c5-well-known.yml.
x-venue-note: >-
  The harvest source https://equityzen.com/company/able42c5 is an EquityZen secondary-market
  listing, not Able's web presence, and is deliberately NOT wired as a Website pointer
  (roadmap#56). The EquityZen slug's 42c5 suffix matches Crunchbase's able-42c5, which is how
  this record was resolved from the placeholder name "Able42c5" to the company Able.
