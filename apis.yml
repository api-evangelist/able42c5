aid: able42c5
name: Able
description: >-
  Able was a San Francisco artificial-intelligence company for commercial lending, founded in
  2020 by Diego Represas and Andrew Hurst and operating at able.ai. Its platform used computer
  vision, robotic process automation and machine learning to collect, read and categorize
  borrower documentation for high-value commercial loan transactions, generating
  transaction-aware document checklists, sending automated follow-up reminders to the borrowing
  team, and giving lenders, borrowers and third parties such as appraisers, guarantors and
  insurers a single collaborative workspace with per-document access controls. It sold to banks
  and lenders rather than to borrowers, exited stealth in June 2022 with a $20M Series A led by
  Canapi Ventures with participation from Human Capital, demonstrated at FinovateFall 2022, and
  advertised SOC 2 compliance. Moody's acquired Able in March 2024 and absorbed it into its
  lending technology portfolio alongside Numerated Growth Technologies. The able.ai and
  ableai.com domains are still registered to Moody's registrant entity MIS Quality Management
  Corp. through CSC Corporate Domains, but the web surface is decommissioned: https://www.able.ai/
  presents no TLS certificate and fails every handshake, while the plain-HTTP listener on that
  host 301-redirects to Moody's Commercial Lending Solutions page. Able never published a
  developer portal, public API, SDK, webhook catalog or machine-readable specification; the
  archived site, whose last HTTP 200 homepage snapshot is 2024-03-28, carried only marketing,
  company, security, careers and legal pages. This profile is retained as a historical record;
  there is no API surface to enrich.
